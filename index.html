<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#143e2e"><title>Floresul Administrativo</title>
  <link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root{--green:#143e2e;--accent:#1b4f3a;--gold:#d7b35a;--paper:#fafaf7;--ink:#121915;--muted:#667069;--line:#e1e5de;--danger:#a83b32}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink)}button,input{font:inherit}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 90% 5%,#dfeade 0,transparent 26%),var(--paper)}.card{width:min(100%,440px);background:#fff;border:1px solid var(--line);border-radius:20px;padding:36px;box-shadow:0 20px 50px #143e2e16}.brand{display:flex;align-items:center;gap:12px;color:var(--green);font-size:1.42rem;font-weight:800;letter-spacing:.02em}.leaf{color:var(--gold);font-size:2rem}.card h1{font-size:1.55rem;margin:28px 0 8px}.card p{line-height:1.5;color:var(--muted)}label{display:block;margin:25px 0 8px;font-weight:650}input{width:100%;padding:14px;border:1px solid #b9c3b9;border-radius:10px;font-size:1rem}.primary{width:100%;margin-top:18px;border:0;background:var(--accent);color:#fff;padding:14px;border-radius:10px;font-weight:750;cursor:pointer}.primary:hover{background:var(--green)}.notice{min-height:24px;margin-top:15px;font-size:.92rem;color:var(--danger)}.dashboard{display:none;min-height:100vh}.top{background:var(--green);color:white;padding:18px clamp(18px,5vw,72px);display:flex;align-items:center;justify-content:space-between;gap:14px}.top .brand{color:#fff}.user{font-size:.9rem;text-align:right}.user span{display:block;color:#d6e0d7;margin-top:3px}.logout{background:transparent;border:1px solid #ffffff66;color:white;border-radius:8px;padding:8px 10px;cursor:pointer}.main{max-width:1240px;margin:auto;padding:36px 24px}.intro{display:flex;justify-content:space-between;gap:20px;align-items:end}.intro h1{font-size:clamp(1.6rem,3vw,2.25rem);margin:0}.intro p{color:var(--muted);margin:8px 0 0}.tag{background:#e6f0e7;color:var(--accent);border-radius:999px;padding:8px 12px;font-size:.85rem;font-weight:700;white-space:nowrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-top:28px}.module{border:1px solid var(--line);border-radius:15px;background:#fff;padding:20px;min-height:160px;display:flex;flex-direction:column;align-items:start;cursor:pointer;text-align:left;transition:.16s;box-shadow:0 2px 8px #17382008}.module:hover{border-color:#8dac92;transform:translateY(-2px);box-shadow:0 9px 22px #17382016}.icon{font-size:1.7rem;background:#edf4ed;border-radius:10px;padding:9px}.module h2{font-size:1.05rem;margin:16px 0 7px}.module p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.4}.modal{position:fixed;inset:0;background:#0c2416a8;display:none;place-items:center;padding:20px}.modal.open{display:grid}.modal>div{background:white;border-radius:16px;max-width:420px;width:100%;padding:26px}.modal h2{margin-top:0}.secondary{border:0;border-radius:8px;background:var(--accent);color:#fff;padding:10px 14px;cursor:pointer}@media(max-width:600px){.top{align-items:flex-start}.user{display:none}.main{padding:26px 16px}.intro{align-items:flex-start;flex-direction:column}.card{padding:27px 22px}}
  </style>
</head>
<body>
  <section id="login" class="login"><main class="card"><div class="brand"><span class="leaf">◒</span> FLORESUL</div><h1>Área Administrativa</h1><p>Informe seu CPF para acessar os recursos administrativos.</p><label for="cpf">CPF</label><input id="cpf" inputmode="numeric" autocomplete="username" placeholder="000.000.000-00" maxlength="14"><button id="enter" class="primary">Entrar</button><div id="status" class="notice" aria-live="polite"></div></main></section>
  <section id="dashboard" class="dashboard"><header class="top"><div class="brand"><span class="leaf">◒</span> FLORESUL <small style="font-size:.72rem;opacity:.72">ADMINISTRATIVO</small></div><div class="user"><strong id="userName"></strong><span id="userRole"></span></div><button class="logout" id="exit">Sair</button></header><main class="main"><div class="intro"><div><h1>Olá, <span id="firstName"></span></h1><p>Escolha uma área para consultar ou registrar informações.</p></div><div class="tag">Acesso administrativo</div></div><section class="grid" aria-label="Módulos administrativos">
    <button class="module" data-module="Checklists"><span class="icon">✓</span><h2>Checklists</h2><p>Consultar, acompanhar e exportar inspeções.</p></button>
    <button class="module" data-module="Entregas de serviço"><span class="icon">▣</span><h2>Entregas de serviço</h2><p>Visualizar registros e comprovantes enviados.</p></button>
    <button class="module" data-module="Entregas mensais"><span class="icon">▤</span><h2>Entregas mensais</h2><p>Acompanhar a competência e os anexos mensais.</p></button>
    <button class="module" data-module="Documentos da equipe"><span class="icon">▰</span><h2>Documentos da equipe</h2><p>Acessar documentos, DDS e materiais publicados.</p></button>
    <button class="module" data-module="Produção semanal"><span class="icon">◫</span><h2>Produção semanal</h2><p>Consultar produção, resumo e histórico.</p></button>
    <button class="module" data-module="Controle de refeições"><span class="icon">◷</span><h2>Controle de refeições</h2><p>Consultar apontamentos e histórico de refeições.</p></button>
    <button class="module" data-module="Localização"><span class="icon">⌖</span><h2>Localização</h2><p>Ver resumo das localizações registradas.</p></button>
    <button class="module" data-module="Previsão do tempo"><span class="icon">☀</span><h2>Previsão do tempo</h2><p>Consultar as condições e a previsão do dia.</p></button>
  </section></main></section>
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div><h2 id="modalTitle"></h2><p id="modalText">Este módulo será conectado aos mesmos dados do aplicativo na próxima etapa.</p><button class="secondary" id="close">Fechar</button></div></div>
  <script>
  const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vTyWa6CJ-kCQyxXOlBZtClyZa4T2kC6zg0DELOSYpV5CLfbGaFIv6QMa2FdqCvsVQ/pub?output=csv';
  const cpf=document.querySelector('#cpf'),status=document.querySelector('#status');
  cpf.addEventListener('input',()=>{let v=cpf.value.replace(/\D/g,'').slice(0,11);cpf.value=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')});
  function parseCsv(text){return text.trim().split(/\r?\n/).map(line=>{let a=[],q=false,x='';for(let i=0;i<line.length;i++){let c=line[i];if(c==='"')q=!q;else if(c===','&&!q){a.push(x.trim());x=''}else x+=c}a.push(x.trim());return a.map(v=>v.replace(/^"|"$/g,'').trim())})}
  async function login(){const doc=cpf.value.replace(/\D/g,'');if(doc.length!==11){status.textContent='Informe o CPF completo, com 11 dígitos.';return}status.style.color='#667069';status.textContent='Verificando cadastro…';document.querySelector('#enter').disabled=true;try{const response=await fetch(CSV_URL,{cache:'no-store'});if(!response.ok)throw Error();const rows=parseCsv(await response.text());const person=rows.find(row=>(row[2]||'').replace(/\D/g,'')===doc);if(!person){status.textContent='CPF não encontrado no cadastro publicado.';return}const [_,name,,role,active]=person;const normalized=(role||'').replace(/\s+/g,' ').trim().toLocaleLowerCase('pt-BR');if((active||'').trim().toLocaleLowerCase('pt-BR')!=='ativo'){status.textContent='Cadastro inativo. Consulte o responsável.';return}if(normalized==='coordenador de equipe'){status.textContent='Este acesso é exclusivo para a área administrativa.';return}sessionStorage.setItem('floresulUser',JSON.stringify({name,role,doc}));openDashboard({name,role})}catch{status.textContent='Não foi possível consultar o cadastro. Verifique sua conexão e tente novamente.'}finally{document.querySelector('#enter').disabled=false}}
  function openDashboard(user){document.querySelector('#login').style.display='none';document.querySelector('#dashboard').style.display='block';document.querySelector('#userName').textContent=user.name;document.querySelector('#userRole').textContent=user.role;document.querySelector('#firstName').textContent=(user.name||'').split(' ')[0]||'usuário'}
  document.querySelector('#enter').addEventListener('click',login);cpf.addEventListener('keydown',e=>{if(e.key==='Enter')login()});document.querySelector('#exit').onclick=()=>{sessionStorage.removeItem('floresulUser');location.reload()};
  const modal=document.querySelector('#modal');document.querySelectorAll('.module').forEach(b=>b.onclick=()=>{document.querySelector('#modalTitle').textContent=b.dataset.module;modal.classList.add('open')});document.querySelector('#close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};
  try{const saved=JSON.parse(sessionStorage.getItem('floresulUser'));if(saved)openDashboard(saved)}catch{}if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');
  </script>
</body></html>
